name: Windows launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test private runtime installation using Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-windows-bootstrap.ps1
